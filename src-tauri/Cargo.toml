[package]
name = "soph-explorer"
version = "0.1.0"
description = "Soph Explorer Debloat — lite Windows file explorer with fast search and PDF preview"
authors = ["Soph Explorer Debloat"]
edition = "2021"
license = "MIT"

[lib]
name = "soph_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
