name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend
        run: npm ci
      - name: Generate icons
        run: |
          python -m pip install --user pillow
          python scripts/generate-icons.py
      - name: Test
        run: npm test
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Soph Explorer Debloat ${{ github.ref_name }}"
          releaseDraft: false
          includeUpdaterJson: false
          releaseBody: |
            Free, lite Windows file explorer — fast search, PDF preview on by default.

            ### Downloads (Windows 10/11 x64)
            - **NSIS installer** (recommended): `Soph Explorer Debloat_*_x64-setup.exe`
            - **MSI** for workplace installers
            - **Portable** `soph-explorer.exe` and/or the portable zip

            If Windows says “Windows protected your PC”, choose **More info → Run anyway**.

            Free forever. No account. No subscription.
      - name: Zip portable exe
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/soph-explorer.exe"
          if (Test-Path $exe) {
            New-Item -ItemType Directory -Force -Path portable-exe | Out-Null
            Copy-Item $exe portable-exe/soph-explorer.exe
            @"
            Soph Explorer Debloat — portable .exe
            Double-click soph-explorer.exe. Free forever.
            If Windows says “Windows protected your PC”, choose More info → Run anyway.
            "@ | Set-Content portable-exe/README.txt
            Compress-Archive -Path portable-exe\* -DestinationPath Soph-Explorer-Debloat-portable-win64.zip -Force
          }
      - name: Attach portable zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: |
            Soph-Explorer-Debloat-portable-win64.zip
            src-tauri/target/release/soph-explorer.exe
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: soph-explorer-windows
          path: |
            src-tauri/target/release/soph-explorer.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            Soph-Explorer-Debloat-portable-win64.zip
